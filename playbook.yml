---
- name: Setup Docker environment on AWS
  hosts: cloud_server
  become: yes

  vars:
    # Variables from .env file
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') }}"
    mysql_database: "{{ lookup('env', 'MYSQL_DATABASE') }}"
    mysql_user: "{{ lookup('env', 'MYSQL_USER') }}"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') }}"
    wordpress_db_host: "{{ lookup('env', 'WORDPRESS_DB_HOST') }}"
    wordpress_db_name: "{{ lookup('env', 'WORDPRESS_DB_NAME') }}"
    wordpress_db_user: "{{ lookup('env', 'WORDPRESS_DB_USER') }}"
    wordpress_db_password: "{{ lookup('env', 'WORDPRESS_DB_PASSWORD') }}"
    pma_host: "{{ lookup('env', 'PMA_HOST') }}"
    pma_port: "{{ lookup('env', 'PMA_PORT') }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    project_dir: /home/ubuntu/cloud-1
    nginx_config_dir: "{{ project_dir }}/nginx"
    certbot_dir: "{{ project_dir }}/certbot"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - certbot
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable
        state: present

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Test Docker installation
      command: docker --version
      register: docker_version

    - name: Display Docker version
      debug:
        msg: "Docker installed: {{ docker_version.stdout }}"

    - name: Test Docker Compose
      command: docker compose version
      register: compose_version

    - name: Display Docker Compose version
      debug:
        msg: "Docker Compose installed: {{ compose_version.stdout }}"

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create nginx config directory
      file:
        path: "{{ nginx_config_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create certbot directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - "{{ certbot_dir }}/conf"
        - "{{ certbot_dir }}/www"

    - name: Check if SSL certificate already exists
      stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
      register: cert_exists

    - name: Generate nginx HTTP config (before certificate)
      template:
        src: ./nginx-wordpress.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: not cert_exists.stat.exists

    - name: Generate nginx HTTPS config (after certificate)
      template:
        src: ./nginx-wordpress-ssl.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: cert_exists.stat.exists

    - name: Generate docker-compose.yml from template
      template:
        src: ./docker-compose.yml.j2
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Start Docker Compose services
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
      become: yes
      become_user: ubuntu

    - name: Wait for WordPress to be ready (HTTP mode)
      uri:
        url: http://localhost:80
        status_code: 200,301,302
        timeout: 3
      register: result
      until: result.status in [200, 301, 302]
      retries: 30
      delay: 2
      when: not cert_exists.stat.exists

    - name: Wait for WordPress to be ready (HTTPS mode)
      uri:
        url: http://localhost:80
        status_code: 301,302
        timeout: 3
      register: result
      until: result.status in [301, 302]
      retries: 10
      delay: 2
      when: cert_exists.stat.exists

    - name: Obtain SSL certificate with Certbot (first time only)
      command: >
        certbot certonly --standalone --non-interactive --agree-tos
        --email {{ email }}
        -d {{ domain_name }}
        --pre-hook "docker compose -f {{ project_dir }}/docker-compose.yml stop nginx || true"
        --post-hook "docker compose -f {{ project_dir }}/docker-compose.yml start nginx || true"
      when: not cert_exists.stat.exists

    - name: Switch to HTTPS nginx config
      template:
        src: ./nginx-wordpress-ssl.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: not cert_exists.stat.exists

    - name: Restart Docker Compose services with nginx
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        restarted: yes
      become: yes
      become_user: ubuntu

    - name: Setup SSL certificate renewal cron job
      cron:
        name: "Renew Let's Encrypt certificates"
        minute: "0"
        hour: "3"
        day: "*/7"
        job: >
          certbot renew --quiet
          --pre-hook "docker compose -f {{ project_dir }}/docker-compose.yml stop nginx"
          --post-hook "docker compose -f {{ project_dir }}/docker-compose.yml start nginx"

    - name: Wait for HTTPS WordPress to be ready
      uri:
        url: https://{{ domain_name }}
        status_code: 200
        timeout: 3
        validate_certs: yes
      register: https_result
      until: https_result.status == 200
      retries: 30
      delay: 2

    - name: Display success message
      debug:
        msg: 
          - "Deployment successful with HTTPS!"
          - "WordPress: https://{{ domain_name }}/"
          - "PHPMyAdmin: https://{{ domain_name }}:8080"
          - "MySQL user: {{ mysql_user }}"
          - "SSL Certificate: Active"
          - "Note: Check .env file for passwords"