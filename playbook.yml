---
- name: Setup Docker environment on AWS
  hosts: cloud_server
  become: yes

  vars:
    # Variables from .env file
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') }}"
    mysql_database: "{{ lookup('env', 'MYSQL_DATABASE') }}"
    mysql_user: "{{ lookup('env', 'MYSQL_USER') }}"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') }}"
    wordpress_db_host: "{{ lookup('env', 'WORDPRESS_DB_HOST') }}"
    wordpress_db_name: "{{ lookup('env', 'WORDPRESS_DB_NAME') }}"
    wordpress_db_user: "{{ lookup('env', 'WORDPRESS_DB_USER') }}"
    wordpress_db_password: "{{ lookup('env', 'WORDPRESS_DB_PASSWORD') }}"
    pma_host: "{{ lookup('env', 'PMA_HOST') }}"
    pma_port: "{{ lookup('env', 'PMA_PORT') }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    project_dir: /home/ubuntu/cloud-1
    nginx_config_dir: "{{ project_dir }}/nginx"
    certbot_dir: "{{ project_dir }}/certbot"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - certbot
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable
        state: present

    - name: Install Docker from official repo
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create project directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - "{{ project_dir }}"
        - "{{ nginx_config_dir }}"
        - "{{ certbot_dir }}/conf"
        - "{{ certbot_dir }}/www"

    - name: Check if SSL certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
      register: cert_exists

    - name: Generate nginx HTTP config (before SSL)
      template:
        src: ./nginx-wordpress.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: not cert_exists.stat.exists

    - name: Generate nginx HTTPS config (after SSL)
      template:
        src: ./nginx-wordpress-ssl.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: cert_exists.stat.exists

    - name: Generate docker-compose.yml
      template:
        src: ./docker-compose.yml.j2
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Start Docker Compose services
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
      become_user: ubuntu

    - name: Obtain SSL certificate (first time only)
      command: >
        certbot certonly --standalone --non-interactive --agree-tos
        --email {{ email }}
        -d {{ domain_name }}
        --pre-hook "docker compose -f {{ project_dir }}/docker-compose.yml stop nginx"
        --post-hook "docker compose -f {{ project_dir }}/docker-compose.yml start nginx"
      when: not cert_exists.stat.exists

    - name: Update to HTTPS nginx config
      template:
        src: ./nginx-wordpress-ssl.conf.j2
        dest: "{{ nginx_config_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: not cert_exists.stat.exists

    - name: Restart services with HTTPS
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        restarted: yes
      become_user: ubuntu
      when: not cert_exists.stat.exists

    - name: Setup SSL renewal cron
      cron:
        name: "Renew SSL certificates"
        minute: "0"
        hour: "3"
        day: "*/7"
        job: >
          certbot renew --quiet
          --pre-hook "docker compose -f {{ project_dir }}/docker-compose.yml stop nginx"
          --post-hook "docker compose -f {{ project_dir }}/docker-compose.yml start nginx"

    - name: Display success message
      debug:
        msg: 
          - "Deployment completed!"
          - "WordPress: https://{{ domain_name }}"
          - "PHPMyAdmin: https://{{ domain_name }}:8080"
          - "Please wait 1-2 minutes for services to fully start, then access your site"